name: Build
on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      upload_artifact:
        description: 'Upload build artifacts'
        type: boolean
        default: true

env:
  MAIN_NAME: binary-waterfall
  PYTHON_VERSION: '3.10'

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: choco install ffmpeg -y

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller pyinstaller-versionfile
          pip install -e .

      - name: Create version file info
        run: |
          $content = Get-Content -Raw -Encoding UTF8 "src/binary_waterfall/version.yml"
          $content = $content -replace [char]0x2618 -replace [char]0xFE0F, "shamrock"
          Set-Content -Path "src/binary_waterfall/version_clean.yml" -Value $content -Encoding ASCII
          create-version-file src/binary_waterfall/version_clean.yml --outfile file_version_info.txt

      - name: Set build info for About dialog
        run: |
          $time = (Get-Date).ToString('yyyy-MM-dd HH:mm:ss')
          $kernel = (Get-CimInstance Win32_OperatingSystem).Version
          echo "BINARY_WATERFALL_BUILD_TIME=$time" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "BINARY_WATERFALL_BUILD_OS=Windows $kernel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean --noconfirm --noconsole `
            --add-data "src/binary_waterfall/*.py;./src/binary_waterfall" `
            --add-data "src/binary_waterfall/version.yml;./src/binary_waterfall" `
            --add-data "src/binary_waterfall/constants/*.py;./src/binary_waterfall/constants" `
            --add-data "src/binary_waterfall/helpers/*.py;./src/binary_waterfall/helpers" `
            --add-data "src/binary_waterfall/resources/*;./src/binary_waterfall/resources" `
            --collect-all "imageio" `
            --collect-all "moviepy" `
            --collect-all "PIL" `
            --collect-all "pydub" `
            --collect-all "yaml" `
            --collect-all "proglog" `
            --copy-metadata "imageio" `
            --copy-metadata "moviepy" `
            --copy-metadata "Pillow" `
            --copy-metadata "pydub" `
            --copy-metadata "PyYAML" `
            --copy-metadata "proglog" `
            --hidden-import "imageio" `
            --hidden-import "imageio.plugins.ffmpeg" `
            --onefile `
            --icon="src/binary_waterfall/resources/icon.ico" `
            --splash="src/binary_waterfall/resources/splash.jpg" `
            --version-file="file_version_info.txt" `
            --name "${{ env.MAIN_NAME }}" `
            "binary-waterfall.py"

      - name: Rename executable
        run: Move-Item -Path "dist/${{ env.MAIN_NAME }}.exe" -Destination "${{ env.MAIN_NAME }}-windows-x86_64.exe" -Force

      - name: Upload artifact (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAIN_NAME }}-windows-x86_64
          path: ${{ env.MAIN_NAME }}-windows-x86_64.exe

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          brew install ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller pyinstaller-versionfile
          pip install -e .

      - name: Generate macOS .icns icon
        run: |
          # Generate .icns from the existing icon.png
          ICON_PNG="src/binary_waterfall/resources/icon.png"
          ICONSET_DIR="/tmp/AppIcon.iconset"
          mkdir -p "$ICONSET_DIR"

          # Generate all required sizes
          for size in 16 32 64 128 256 512 1024; do
            sips -z $size $size "$ICON_PNG" --out "$ICONSET_DIR/icon_${size}x${size}.png" 2>/dev/null || true
            if [ $size -le 512 ]; then
              half=$((size * 2))
              sips -z $half $half "$ICON_PNG" --out "$ICONSET_DIR/icon_${size}x${size}@2x.png" 2>/dev/null || true
            fi
          done

          # Create .icns using iconutil
          ICON_ICNS="src/binary_waterfall/resources/icon.icns"
          iconutil -c icns "$ICONSET_DIR" -o "$ICON_ICNS"
          echo "Generated .icns icon at $ICON_ICNS"

      - name: Set build info for About dialog
        run: |
          echo "BINARY_WATERFALL_BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "BINARY_WATERFALL_BUILD_OS=macOS $(uname -r)" >> $GITHUB_ENV

      - name: Build with PyInstaller
        run: |
          # Exclude unused Qt modules and PIL plugins to reduce bundle size
          EXCLUDES=(
            "PyQt5.QtQml" "PyQt5.QtQuick" "PyQt5.QtQuick3D"
            "PyQt5.QtDBus" "PyQt5.QtWebSockets" "PyQt5.QtWebEngineWidgets"
            "PyQt5.QtOpenGL" "PyQt5.QtOpenGLFunctions" "PyQt5.QtPrintSupport"
            "PyQt5.QtXml" "PyQt5.QtXmlPatterns" "PyQt5.QtTest"
            "PyQt5.QtHelp" "PyQt5.QtDesigner" "PyQt5.QtSql"
            "PyQt5.QtBluetooth" "PyQt5.QtNfc" "PyQt5.QtPositioning"
            "PyQt5.QtLocation" "PyQt5.QtSensors" "PyQt5.QtSerialPort"
            "PyQt5.QtContacts" "PyQt5.QtOrganizer" "PyQt5.QtFeedback"
            "PIL.SpiderImagePlugin" "PIL.FpxImagePlugin" "PIL.MicImagePlugin"
            "PIL.MpegImagePlugin" "PIL.DcxImagePlugin" "PIL.PcdImagePlugin"
            "PIL.PcxImagePlugin" "PIL.IptcImagePlugin" "PIL.XbmImagePlugin"
            "PIL.XpmImagePlugin" "PIL.WalImageFile" "PIL.BufrStubImagePlugin"
            "PIL.FitsStubImagePlugin" "PIL.GribStubImagePlugin" "PIL.Hdf5StubImagePlugin"
            "PIL.MpoImagePlugin" "PIL.FtexImagePlugin" "PIL.PalmImagePlugin"
            "PIL.PdfImagePlugin" "PIL.FliImagePlugin" "PIL.GimpPaletteFile"
            "PIL.GimpGradientFile" "PIL.GbrImagePlugin" "PIL.GifImagePlugin"
            "PIL.ImtImagePlugin" "PIL.IcoImagePlugin" "PIL.CurImagePlugin"
            "PIL.SgiImagePlugin" "PIL.SunImagePlugin" "PIL.PpmImagePlugin"
            "PIL.PsdImagePlugin" "PIL.TgaImagePlugin" "PIL.MspImagePlugin"
            "PIL.IcnsImagePlugin" "PIL.DdsImagePlugin" "PIL.BlpImagePlugin"
            "PIL.DibImagePlugin" "PIL.EpsImagePlugin" "PIL.ImImagePlugin"
            "PIL.McIdasImagePlugin" "PIL.PixarImagePlugin" "PIL.PointImagePlugin"
            "PIL.PngImagePlugin" "PIL.JpegImagePlugin"
          )
          EXCLUDE_ARGS=()
          for mod in "${EXCLUDES[@]}"; do
            EXCLUDE_ARGS+=("--exclude-module" "$mod")
          done

          pyinstaller --clean --noconfirm --windowed \
            --add-data "src/binary_waterfall/*.py:./src/binary_waterfall" \
            --add-data "src/binary_waterfall/version.yml:./src/binary_waterfall" \
            --add-data "src/binary_waterfall/constants/*.py:./src/binary_waterfall/constants" \
            --add-data "src/binary_waterfall/helpers/*.py:./src/binary_waterfall/helpers" \
            --add-data "src/binary_waterfall/resources/*:./src/binary_waterfall/resources" \
            --collect-all "imageio" \
            --collect-all "moviepy" \
            --collect-all "PIL" \
            --collect-all "pydub" \
            --collect-all "yaml" \
            --collect-all "proglog" \
            --copy-metadata "imageio" \
            --copy-metadata "moviepy" \
            --copy-metadata "Pillow" \
            --copy-metadata "pydub" \
            --copy-metadata "PyYAML" \
            --copy-metadata "proglog" \
            --hidden-import "imageio" \
            --hidden-import "PIL._tkinter_finder" \
            "${EXCLUDE_ARGS[@]}" \
            --onedir \
            --icon="src/binary_waterfall/resources/icon.icns" \
            --osx-bundle-identifier="com.nimaid.binary-waterfall" \
            --name "${{ env.MAIN_NAME }}" \
            "binary-waterfall.py"

      - name: Rename app bundle
        run: |
          if [ -d "dist/${{ env.MAIN_NAME }}.app" ]; then
            mv "dist/${{ env.MAIN_NAME }}.app" "${{ env.MAIN_NAME }}-macos-arm64.app"
            echo "Success: .app bundle created for arm64"
          else
            echo "ERROR: Could not find built app bundle"
            ls -la dist/ 2>/dev/null || echo "dist/ directory not found"
            exit 1
          fi

      - name: Ad-hoc code sign (required for Finder launch)
        run: |
          codesign --force --deep --sign - "${{ env.MAIN_NAME }}-macos-arm64.app" && \
            echo "Signed ad-hoc: ${{ env.MAIN_NAME }}-macos-arm64.app"

      - name: Compress .app bundle
        run: |
          # Package as tar.gz so the .app bundle stays intact on download
          tar czf "${{ env.MAIN_NAME }}-macos-arm64.tar.gz" "${{ env.MAIN_NAME }}-macos-arm64.app"
          ls -lh "${{ env.MAIN_NAME }}-macos-arm64.tar.gz"

      - name: Upload artifact (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAIN_NAME }}-macos-arm64
          path: ${{ env.MAIN_NAME }}-macos-arm64.tar.gz

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install pyinstaller
          pip install -e .

      - name: Set build info for About dialog
        run: |
          echo "BINARY_WATERFALL_BUILD_TIME=$(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV
          echo "BINARY_WATERFALL_BUILD_OS=Linux $(uname -r)" >> $GITHUB_ENV

      - name: Build with PyInstaller
        run: |
          # Exclude unused Qt modules and PIL plugins
          EXCLUDES=(
            "PyQt5.QtQml" "PyQt5.QtQuick" "PyQt5.QtQuick3D"
            "PyQt5.QtDBus" "PyQt5.QtWebSockets" "PyQt5.QtWebEngineWidgets"
            "PyQt5.QtOpenGL" "PyQt5.QtOpenGLFunctions" "PyQt5.QtPrintSupport"
            "PyQt5.QtXml" "PyQt5.QtXmlPatterns" "PyQt5.QtTest"
            "PyQt5.QtHelp" "PyQt5.QtDesigner" "PyQt5.QtSql"
            "PyQt5.QtBluetooth" "PyQt5.QtNfc" "PyQt5.QtPositioning"
            "PyQt5.QtLocation" "PyQt5.QtSensors" "PyQt5.QtSerialPort"
            "PyQt5.QtContacts" "PyQt5.QtOrganizer" "PyQt5.QtFeedback"
            "PIL.SpiderImagePlugin" "PIL.FpxImagePlugin" "PIL.MicImagePlugin"
            "PIL.MpegImagePlugin" "PIL.DcxImagePlugin" "PIL.PcdImagePlugin"
            "PIL.PcxImagePlugin" "PIL.IptcImagePlugin" "PIL.XbmImagePlugin"
            "PIL.XpmImagePlugin" "PIL.WalImageFile" "PIL.BufrStubImagePlugin"
            "PIL.FitsStubImagePlugin" "PIL.GribStubImagePlugin" "PIL.Hdf5StubImagePlugin"
            "PIL.MpoImagePlugin" "PIL.FtexImagePlugin" "PIL.PalmImagePlugin"
            "PIL.PdfImagePlugin" "PIL.FliImagePlugin" "PIL.GimpPaletteFile"
            "PIL.GimpGradientFile" "PIL.GbrImagePlugin" "PIL.GifImagePlugin"
            "PIL.ImtImagePlugin" "PIL.IcoImagePlugin" "PIL.CurImagePlugin"
            "PIL.SgiImagePlugin" "PIL.SunImagePlugin" "PIL.PpmImagePlugin"
            "PIL.PsdImagePlugin" "PIL.TgaImagePlugin" "PIL.MspImagePlugin"
            "PIL.IcnsImagePlugin" "PIL.DdsImagePlugin" "PIL.BlpImagePlugin"
            "PIL.DibImagePlugin" "PIL.EpsImagePlugin" "PIL.ImImagePlugin"
            "PIL.McIdasImagePlugin" "PIL.PixarImagePlugin" "PIL.PointImagePlugin"
            "PIL.PngImagePlugin" "PIL.JpegImagePlugin"
          )
          EXCLUDE_ARGS=()
          for mod in "${EXCLUDES[@]}"; do
            EXCLUDE_ARGS+=("--exclude-module" "$mod")
          done

          pyinstaller --clean --noconfirm --noconsole \
            --add-data "src/binary_waterfall/*.py:./src/binary_waterfall" \
            --add-data "src/binary_waterfall/version.yml:./src/binary_waterfall" \
            --add-data "src/binary_waterfall/constants/*.py:./src/binary_waterfall/constants" \
            --add-data "src/binary_waterfall/helpers/*.py:./src/binary_waterfall/helpers" \
            --add-data "src/binary_waterfall/resources/*:./src/binary_waterfall/resources" \
            --collect-all "imageio" \
            --collect-all "moviepy" \
            --collect-all "PIL" \
            --collect-all "pydub" \
            --collect-all "yaml" \
            --collect-all "proglog" \
            --copy-metadata "imageio" \
            --copy-metadata "moviepy" \
            --copy-metadata "Pillow" \
            --copy-metadata "pydub" \
            --copy-metadata "PyYAML" \
            --copy-metadata "proglog" \
            --hidden-import "imageio" \
            --hidden-import "PIL._tkinter_finder" \
            "${EXCLUDE_ARGS[@]}" \
            --onedir \
            --icon="src/binary_waterfall/resources/icon.png" \
            --name "${{ env.MAIN_NAME }}" \
            "binary-waterfall.py"

      - name: Prepare AppDir
        run: |
          BUILDDIR="dist/${{ env.MAIN_NAME }}"
          APPDIR="${{ env.MAIN_NAME }}.AppDir"
          mkdir -p "$APPDIR/usr/bin" "$APPDIR/usr/share/applications" "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp -r "$BUILDDIR"/* "$APPDIR/usr/bin/"
          cp "src/binary_waterfall/resources/icon.png" "$APPDIR/usr/share/icons/hicolor/256x256/apps/binary-waterfall.png"

          # AppRun entry point - write with printf to avoid heredoc indentation issues
          printf '%s\n' \
            '#!/bin/bash' \
            'HERE="$(dirname "$(readlink -f "$0")")"' \
            'export PATH="${HERE}/usr/bin:$PATH"' \
            'export LD_LIBRARY_PATH="${HERE}/usr/bin/lib:$LD_LIBRARY_PATH"' \
            'exec "${HERE}/usr/bin/binary-waterfall" "$@"' > "$APPDIR/AppRun"
          chmod +x "$APPDIR/AppRun"

          # .desktop file
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Binary Waterfall Revived' \
            'Comment=A Raw Data Media Player' \
            'Exec=binary-waterfall' \
            'Icon=binary-waterfall' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=AudioVideo;Player;' > "$APPDIR/binary-waterfall.desktop"

          ln -sf "usr/share/icons/hicolor/256x256/apps/binary-waterfall.png" "$APPDIR/binary-waterfall.png"
          echo "AppDir prepared at: $APPDIR"

      - name: Install appimagetool
        run: |
          sudo apt-get install -y -qq libfuse2
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" -O /tmp/appimagetool
          chmod +x /tmp/appimagetool
          cd /tmp && ./appimagetool --appimage-extract 2>/dev/null || /tmp/appimagetool --appimage-extract
          echo "APPIMAGETOOL=/tmp/squashfs-root/AppRun" >> "$GITHUB_ENV"

      - name: Build AppImage
        run: |
          ARCH=x86_64 ${{ env.APPIMAGETOOL }} "${{ env.MAIN_NAME }}.AppDir" "${{ env.MAIN_NAME }}-linux-x86_64.AppImage"

      - name: Upload artifact (Linux)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.MAIN_NAME }}-linux-x86_64
          path: ${{ env.MAIN_NAME }}-linux-x86_64.AppImage

  create-release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Binary Waterfall ${{ github.ref_name }}
          body: |
            ## Binary Waterfall ${{ github.ref_name }}

            ### Downloads:
            - **Windows (x86_64)**: `binary-waterfall-windows-x86_64.exe`
            - **macOS (Apple Silicon)**: `binary-waterfall-macos-arm64.tar.gz`
            - **Linux (x86_64)**: `binary-waterfall-linux-x86_64.AppImage`

            ### Installation
            - **Windows**: Download the `.exe` file and run it directly.
            - **macOS**: Download the `.tar.gz` file, extract it, then right-click the `.app` and select "Open" to bypass Gatekeeper (first launch only).
            - **Linux**: Download the `.AppImage` file, `chmod +x` it, and run it directly.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            binary-waterfall-*/
            !binary-waterfall-*/*.py
          fail_on_unmatched_files: false
